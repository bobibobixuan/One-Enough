# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace --console=plain --warning-mode all
      - name: collect failure diagnostics
        if: failure()
        run: |
          echo "=== Gradle report files ==="
          find . -path "*/build/reports/*" -type f | sort || true
          echo "=== Fabric build outputs ==="
          find fabric/build -maxdepth 4 -type f | sort || true
          echo "=== Forge build outputs ==="
          find forge/build -maxdepth 4 -type f | sort || true
      - name: capture build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            build/reports/**
            fabric/build/reports/**
            forge/build/reports/**
          if-no-files-found: warn
